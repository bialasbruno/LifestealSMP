name: LifestealSouls
version: '${version}'
main: dev.lifesteal.souls.LifestealSoulsPlugin
api-version: '26.2'
description: Player-bound Souls currency for LifestealSMP.
author: Bruno
softdepend:
  - LifestealScoreboard

commands:
  afk:
    description: Teleports you to the configured AFK location.
    usage: /afk
    aliases: [soulafk]
    permission: lifestealsouls.afk
  souls:
    description: Shows your Souls balance.
    usage: /souls
    permission: lifestealsouls.balance
  soulstop:
    description: Opens the Souls balance leaderboard GUI.
    usage: /soulstop
    permission: lifestealsouls.balance
  soulsadmin:
    description: Administrative commands for LifestealSouls.
    usage: /soulsadmin <balance|add|remove|set|purchase|history|reload> ...
    permission: lifestealsouls.admin

permissions:
  lifestealsouls.afk:
    description: Allows teleporting to the configured AFK zone.
    default: true
  lifestealsouls.balance:
    description: Allows checking your own Souls balance and opening the leaderboard GUI.
    default: true
  lifestealsouls.admin:
    description: Allows managing balances and viewing transaction history.
    default: op
